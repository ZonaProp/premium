<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Alquiler de Departamentos en Núñez | ZonaProp Premium</title>
<meta name="description" content="Departamentos en alquiler en Núñez, Buenos Aires. Fotos reales y reserva online."/>
<link rel="canonical" href="https://zonaprop.github.io/premium/nunez.html"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none}header .brand span{color:#ff5500}
header a.wa{background:#25D366;padding:.45rem .85rem;border-radius:999px;font-size:.85rem;font-weight:700}
.back{display:inline-block;margin:1rem;color:#ff5500;font-weight:600;text-decoration:none}
.hero{max-width:1140px;margin:0 auto;padding:0 1rem .5rem}.hero h1{font-size:1.35rem}.hero p{color:#555;font-size:.92rem}
.meta{max-width:1140px;margin:0 auto .6rem;padding:0 1rem;font-size:.85rem;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem;max-width:1140px;margin:0 auto;padding:0 1rem 2.5rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}.card a{text-decoration:none;color:inherit}
.card-img{aspect-ratio:4/3;background:#eee}.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:.9rem 1rem}.price{font-size:1.2rem;font-weight:800;color:#ff5500}h2{font-size:.95rem;font-weight:700}
.specs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}.spec{background:#f0f0f0;border-radius:999px;padding:.25rem .55rem;font-size:.72rem;font-weight:600}
.loading{text-align:center;padding:3rem;color:#888}
</style>
</head>
<body>
<header><a class="brand" href="index.html">Zona<span>Prop</span> Premium</a><a class="wa" href="https://wa.me/5491126070920" target="_blank" rel="noopener">WhatsApp</a></header>
<a class="back" href="index.html">← Ver todos</a>
<div class="hero"><h1>Departamentos en alquiler en Núñez</h1><p>Selección disponible en Núñez.</p></div>
<div class="meta" id="meta">Cargando...</div>
<div class="grid" id="grid"><div class="loading">Cargando...</div></div>
<script>
const ZONA="Núñez";const DB="https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE";
Promise.all([fetch("data.json").then(r=>r.json()).catch(()=>[]),fetch(DB).then(r=>r.json()).then(db=>Array.isArray(db.listings)?db.listings:[]).catch(()=>[])]).then(function(res){
  const ALL=(res[1]||[]).concat(res[0]||[]);
  const list=ALL.filter(d=>{const z=(d.zona||"").toLowerCase();return z.includes("núñez")||z.includes("nunez")||z.includes("nuñez")});
  document.getElementById("meta").textContent=list.length+" departamentos en "+ZONA;
  if(!list.length){document.getElementById("grid").innerHTML='<div class="loading">No hay departamentos disponibles ahora.</div>';return}
  document.getElementById("grid").innerHTML=list.map(d=>{const img=(d.photos&&d.photos[0])||d.main||"logo.svg";const specs=[d.ambientes,d.dormitorios,d.banos,d.m2].filter(Boolean).map(s=>'<span class="spec">'+s+'</span>').join("");return '<div class="card"><a href="depto.html?id='+encodeURIComponent(d.id)+'"><div class="card-img"><img src="'+img+'" alt="Departamento en Núñez" loading="lazy"></div><div class="card-body"><div class="price">'+(d.price||"Consultar")+'</div><h2>'+(d.title||"Departamento")+'</h2><div class="specs">'+specs+'</div></div></a></div>'}).join("");
}).catch(function(){document.getElementById("grid").innerHTML='<div class="loading">Error</div>'});
</script>
</body>
</html>
