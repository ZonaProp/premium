<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<title>Departamento · ZonaProp Premium</title>
<meta name="description" content="Departamento en alquiler · ZonaProp Premium"/>

<!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ZonaProp Premium"/>
<meta property="og:locale" content="es_AR"/>
<meta property="og:url" content="https://zonaprop.github.io/premium/depto.html"/>
<meta property="og:title" content="Departamento · ZonaProp Premium" id="ogTitle"/>
<meta property="og:description" content="Departamento en alquiler en Buenos Aires. Mirá fotos, precio y reservá." id="ogDesc"/>
<meta property="og:image" content="https://zonaprop.github.io/premium/logo.svg" id="ogImage"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Departamento · ZonaProp Premium" id="twTitle"/>
<meta name="twitter:description" content="Departamento en alquiler en Buenos Aires. Mirá fotos, precio y reservá." id="twDesc"/>
<meta name="twitter:image" content="https://zonaprop.github.io/premium/logo.svg" id="twImage"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f0f0;color:#222}
.header{background:#1a1a2e;color:#fff;padding:.8rem 1rem;display:flex;align-items:center;gap:.6rem}
.header a{color:#fff;text-decoration:none;font-size:1.2rem}
.gallery{position:relative;background:#111}
.gallery img.main{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.g-nav{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.g-nav button{background:rgba(0,0,0,.6);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:999px;font-size:.8rem}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fff;scrollbar-width:none}
.thumbs img{width:70px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.65;flex-shrink:0}
.thumbs img.on{opacity:1;outline:2px solid #ff5500}
.box{background:#fff;margin-top:8px;padding:1.1rem 1.2rem}
.price{font-size:1.55rem;font-weight:800;color:#ff5500}
.h2{font-size:1.1rem;font-weight:700;margin:.25rem 0}
.zona{font-size:.85rem;color:#666;margin-top:.15rem}
.specs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.spec{background:#f3f3f3;border-radius:999px;padding:.4rem .75rem;font-size:.82rem;font-weight:600}
.desc{margin-top:.9rem;font-size:.9rem;line-height:1.45;color:#444}
.feats{margin-top:.9rem}
.feats h3{font-size:.95rem;margin-bottom:.5rem}
.feat-list{display:flex;flex-wrap:wrap;gap:.4rem}
.feat{border:1px solid #e0e0e0;border-radius:8px;padding:.35rem .65rem;font-size:.8rem;background:#fafafa}
.reserva{background:#fff;margin-top:8px;padding:1.2rem;border-top:3px solid #ff5500}
.reserva h3{font-size:1rem;margin-bottom:.6rem}
.reserva-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid #eee}
.reserva-row:last-child{border-bottom:0}
.reserva-monto{font-size:1.35rem;font-weight:800;color:#ff5500}
.reserva-note{font-size:.8rem;color:#666;margin-top:.6rem;line-height:1.4}
.fecha-ingreso{margin-top:1rem;padding-top:.9rem;border-top:1px solid #eee}
.fecha-ingreso label{display:block;font-size:.88rem;font-weight:700;margin-bottom:.4rem;color:#333}
.fecha-ingreso input[type="date"]{width:100%;padding:.75rem .9rem;border:1.5px solid #ddd;border-radius:10px;font-size:1rem;background:#fafafa;font-family:inherit}
.fecha-ingreso input[type="date"]:focus{outline:none;border-color:#ff5500;box-shadow:0 0 0 3px rgba(255,85,0,.15)}
.fecha-hint{font-size:.78rem;color:#888;margin-top:.35rem}
.pago{background:#fff;margin-top:8px;padding:1.2rem}
.pago h3{font-size:1rem;margin-bottom:.8rem}
.pago-btns{display:flex;flex-direction:column;gap:10px}
.btn-mp{display:block;text-align:center;padding:.85rem 1rem;border-radius:10px;font-weight:700;text-decoration:none;color:#fff;background:#009ee3;font-size:.95rem}
.btn-wa{display:block;text-align:center;padding:.85rem 1rem;border-radius:10px;font-weight:700;text-decoration:none;color:#fff;background:#25d366;font-size:.95rem}
.btn-sec{display:block;text-align:center;padding:.7rem 1rem;border-radius:10px;font-weight:600;text-decoration:none;color:#1a1a2e;background:#eee;font-size:.9rem}
footer{text-align:center;padding:1.4rem;color:#888;font-size:.82rem}
.loading{text-align:center;padding:3rem;color:#888}
</style>
</head>
<body>
<div class="header"><a href="index.html">←</a> <span>ZonaProp</span></div>
<div id="content"><div class="loading">Cargando...</div></div>
<script>
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';
const params = new URLSearchParams(location.search);
const id = params.get('id');
if (!id) {
  document.getElementById('content').innerHTML = '<div class="loading">No se especificó departamento</div>';
} else {
  Promise.all([
    fetch('data.json').then(r => r.json()).catch(function(){ return []; }),
    fetch(DB_URL).then(r => r.json()).then(function(db){ return Array.isArray(db.listings) ? db.listings : []; }).catch(function(){ return []; })
  ]).then(function(results){
      const data = (results[1] || []).concat(results[0] || []);
      const d = data.find(x => String(x.id) === String(id));
      if (!d) {
        document.getElementById('content').innerHTML = '<div class="loading">Departamento no encontrado</div>';
        return;
      }

      // --- Actualizar meta tags para vista previa al compartir ---
      const title = (d.title || 'Departamento') + (d.price ? ' · ' + d.price : '') + ' · ZonaProp';
      const desc = (d.zona ? d.zona + ' · ' : '') + (d.ambientes || '') + (d.dormitorios ? ' · ' + d.dormitorios : '') + (d.m2 ? ' · ' + d.m2 : '') + (d.desc ? ' · ' + d.desc.slice(0, 120) : ' Departamento en alquiler');
      const img = (d.photos && d.photos[0]) || d.main || 'https://zonaprop.github.io/premium/logo.svg';
      const pageUrl = 'https://zonaprop.github.io/premium/depto.html?id=' + encodeURIComponent(d.id);

      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute('content', desc);

      // Open Graph
      document.getElementById('ogTitle').setAttribute('content', title);
      document.getElementById('ogDesc').setAttribute('content', desc);
      document.getElementById('ogImage').setAttribute('content', img);
      document.querySelector('meta[property="og:url"]').setAttribute('content', pageUrl);

      // Twitter
      document.getElementById('twTitle').setAttribute('content', title);
      document.getElementById('twDesc').setAttribute('content', desc);
      document.getElementById('twImage').setAttribute('content', img);

      const photos = (d.photos && d.photos.length) ? d.photos : (d.main ? [d.main] : []);
      const waNum = (d.contacto_tel || '').replace(/\D/g,'');
      const wa = waNum.length >= 8 ? ('549' + waNum.replace(/^549/,'').replace(/^0/,'')) : '5491125692598';
      const specs = [d.ambientes, d.dormitorios, d.banos, d.m2].filter(Boolean);
      const feats = d.features || [];

      // Fecha mínima = hoy
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth() + 1).padStart(2, '0');
      const dd = String(hoy.getDate()).padStart(2, '0');
      const minDate = yyyy + '-' + mm + '-' + dd;

      document.getElementById('content').innerHTML = `
        <div class="gallery">
          <img class="main" id="mainImg" src="${photos[0]||''}" alt="">
          <div class="counter" id="counter">1 / ${photos.length || 1}</div>
          <div class="g-nav"><button onclick="show(cur-1)">‹</button><button onclick="show(cur+1)">›</button></div>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="box">
          <div class="price">${d.price}</div>
          <div class="h2">${d.title}</div>
          ${d.zona ? `<div class="zona">${d.zona}${d.community ? ' · Publicación de la comunidad' : ''}</div>` : ''}
          <div class="specs">${specs.map(s => `<span class="spec">${s}</span>`).join('')}</div>
          ${d.desc ? `<div class="desc">${d.desc}</div>` : ''}
          ${feats.length ? `<div class="feats"><h3>Características</h3><div class="feat-list">${feats.map(f => `<span class="feat">${f}</span>`).join('')}</div></div>` : ''}
        </div>
        <div class="reserva">
          <h3>Reserva para asegurar el departamento</h3>
          <div class="reserva-row"><span>Seña / reserva</span><span class="reserva-monto">$ 50.000</span></div>
          <div class="reserva-row"><span>Se descuenta del primer mes</span><span>Sí</span></div>
          <p class="reserva-note">Al pagar la reserva de $50.000 el departamento queda bloqueado a tu nombre.</p>

          <div class="fecha-ingreso">
            <label for="fechaIngreso">📅 Fecha de ingreso deseada</label>
            <input type="date" id="fechaIngreso" min="${minDate}" required />
            <p class="fecha-hint">Elegí en el calendario la fecha en la que querés ingresar al departamento.</p>
          </div>
        </div>
        <div class="pago">
          <h3>Pagar reserva / Contacto</h3>
          <div class="pago-btns">
            <a class="btn-mp" href="https://www.mercadopago.com.ar/" target="_blank" rel="noopener">Pagar $50.000 con Mercado Pago</a>
            <a class="btn-wa" id="btnWa" href="#">WhatsApp</a>
            <a class="btn-sec" id="btnConsultar" href="#">Consultar</a>
          </div>
        </div>
        <footer>ZonaProp Premium</footer>
      `;

      // Actualizar links de WhatsApp cuando cambie la fecha
      function updateWaLinks() {
        const fechaVal = document.getElementById('fechaIngreso').value;
        let fechaTxt = '';
        if (fechaVal) {
          const [y, m, day] = fechaVal.split('-');
          fechaTxt = ' · Fecha de ingreso: ' + day + '/' + m + '/' + y;
        }
        const baseText = 'Hola! Quiero reservar: ' + d.title + ' (ID ' + d.id + '). Reserva de $50.000' + fechaTxt;
        const waText = encodeURIComponent(baseText);
        const href = 'https://wa.me/' + wa + '?text=' + waText;
        document.getElementById('btnWa').href = href;
        document.getElementById('btnConsultar').href = href;
      }

      document.getElementById('fechaIngreso').addEventListener('change', updateWaLinks);
      updateWaLinks(); // inicial

      window.photos = photos.length ? photos : [''];
      window.cur = 0;
      const t = document.getElementById('thumbs');
      photos.forEach((p, i) => {
        const img = document.createElement('img');
        img.src = p;
        img.onclick = () => show(i);
        if (i === 0) img.classList.add('on');
        t.appendChild(img);
      });
    })
    .catch(e => {
      document.getElementById('content').innerHTML = '<div class="loading">Error cargando</div>';
    });
}
function show(i) {
  if (!window.photos || !window.photos.length) return;
  if (i < 0) i = window.photos.length - 1;
  if (i >= window.photos.length) i = 0;
  window.cur = i;
  document.getElementById('mainImg').src = window.photos[i];
  document.getElementById('counter').textContent = (i+1) + ' / ' + window.photos.length;
  document.querySelectorAll('#thumbs img').forEach((el, idx) => el.classList.toggle('on', idx === i));
}
</script>
</body>
</html>
