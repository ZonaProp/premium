<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin · Aprobar publicaciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.25rem;margin:1rem 0 .5rem}
.login{background:#fff;padding:1.2rem;border-radius:14px;max-width:360px;margin:2rem auto}
.login input{width:100%;padding:.7rem;border:1px solid #ddd;border-radius:10px;margin:.5rem 0 1rem}
.login button{width:100%;padding:.8rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:800}
.card{background:#fff;border-radius:14px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:.6rem}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:.6rem}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px}
.price{color:#ff5500;font-weight:800;font-size:1.15rem}
.meta{font-size:.85rem;color:#666;margin:.25rem 0}
.actions{display:flex;gap:.5rem;margin-top:.8rem}
.actions button{flex:1;padding:.7rem;border:0;border-radius:10px;font-weight:700;cursor:pointer;color:#fff}
.ok{background:#2e7d32}.no{background:#c62828}
.empty{text-align:center;padding:2rem;color:#888}
.err{color:#c62828;font-size:.9rem;margin-top:.5rem}
</style>
</head>
<body>
<header>
  <strong>Admin ZonaProp</strong>
  <a href="index.html">Ver sitio</a>
</header>
<div class="wrap" id="app">
  <div class="login" id="loginBox">
    <h2>Acceso admin</h2>
    <p style="font-size:.9rem;color:#666;margin:.4rem 0">Ingresá la clave para aprobar publicaciones.</p>
    <input id="pass" type="password" placeholder="Clave admin"/>
    <button type="button" id="btnLogin">Entrar</button>
    <div class="err" id="loginErr" style="display:none">Clave incorrecta</div>
  </div>
  <div id="panel" style="display:none">
    <h1>Pendientes de aprobación</h1>
    <p class="meta" id="count"></p>
    <div id="list"></div>
  </div>
</div>
<script>
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';
// Clave simple (cambiá si querés)
const ADMIN_PASS = 'zonaprop2026';

if (sessionStorage.getItem('zp_admin') === '1') showPanel();

document.getElementById('btnLogin').onclick = function(){
  if (document.getElementById('pass').value === ADMIN_PASS) {
    sessionStorage.setItem('zp_admin', '1');
    showPanel();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
};

async function loadDB(){
  const r = await fetch(DB_URL + '?t=' + Date.now());
  const db = await r.json();
  return {
    listings: Array.isArray(db.listings) ? db.listings : [],
    pending: Array.isArray(db.pending) ? db.pending : []
  };
}

async function saveDB(db){
  const r = await fetch(DB_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(db)
  });
  if (!r.ok) throw new Error('save failed');
}

async function showPanel(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  await render();
}

async function render(){
  const db = await loadDB();
  const list = document.getElementById('list');
  document.getElementById('count').textContent = db.pending.length + ' pendiente(s)';
  if (!db.pending.length) {
    list.innerHTML = '<div class="empty">No hay publicaciones pendientes.</div>';
    return;
  }
  list.innerHTML = db.pending.map((d, idx) => {
    const photos = d.photos || (d.main ? [d.main] : []);
    const main = photos[0] || '';
    return `<div class="card" data-id="${d.id}">
      ${main ? `<img src="${main}" alt="">` : ''}
      ${photos.length > 1 ? `<div class="thumbs">${photos.slice(0,6).map(p=>`<img src="${p}">`).join('')}</div>` : ''}
      <div class="price">${d.price||''}</div>
      <strong>${d.title||''}</strong>
      <div class="meta">${d.zona||''} · ${d.ambientes||''} · ${photos.length} fotos</div>
      <div class="meta">Contacto: ${d.contacto_nombre||''} · ${d.contacto_tel||''} · ${d.contacto_email||''}</div>
      <div class="meta">ID: ${d.id}</div>
      ${d.desc ? `<div class="meta">${d.desc}</div>` : ''}
      <div class="actions">
        <button class="ok" type="button" data-act="ok" data-id="${d.id}">Aprobar</button>
        <button class="no" type="button" data-act="no" data-id="${d.id}">Rechazar</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      btn.disabled = true;
      try {
        const db = await loadDB();
        const i = db.pending.findIndex(x => x.id === id);
        if (i < 0) { await render(); return; }
        const item = db.pending[i];
        db.pending.splice(i, 1);
        if (act === 'ok') {
          item.aprobado = true;
          item.aprobado_en = new Date().toISOString();
          db.listings.unshift(item);
        }
        await saveDB(db);
        await render();
      } catch (e) {
        alert('Error al guardar. Reintentá.');
        btn.disabled = false;
      }
    };
  });
}

// deep link ?id= to highlight
const focusId = new URLSearchParams(location.search).get('id');
if (focusId && sessionStorage.getItem('zp_admin') === '1') {
  setTimeout(() => {
    const el = document.querySelector('[data-id="'+focusId+'"]');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 500);
}
</script>
</body>
</html>
