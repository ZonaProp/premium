<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:1rem 1.1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
header strong{font-size:1.05rem}
header a{color:#fff;text-decoration:none;font-size:.88rem;opacity:.9}
header a:hover{opacity:1}
.wrap{max-width:780px;margin:0 auto;padding:1rem 1rem 3.5rem}
.login{background:#fff;padding:1.5rem;border-radius:16px;max-width:380px;margin:3rem auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.login h2{font-size:1.2rem;margin-bottom:.3rem}
.login p{font-size:.9rem;color:#666;margin-bottom:1rem}
.login input{width:100%;padding:.75rem .9rem;border:1.5px solid #ddd;border-radius:10px;margin:.4rem 0 1rem;font-size:1rem}
.login button{width:100%;padding:.9rem;border:0;border-radius:12px;background:#ff5500;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.err{color:#c62828;font-size:.88rem;margin-top:.5rem;display:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1rem 0 1.2rem}
.stat{background:#fff;border-radius:12px;padding:.9rem .8rem;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.stat .n{font-size:1.5rem;font-weight:800;color:#1a1a2e}
.stat .l{font-size:.72rem;color:#666;margin-top:.15rem}
.stat.orange .n{color:#ff5500}
.stat.green .n{color:#2e7d32}

.tabs{display:flex;gap:.4rem;margin:0 0 1rem;flex-wrap:wrap}
.tabs button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:.45rem 1rem;font-size:.86rem;cursor:pointer;font-weight:600;transition:all .15s}
.tabs button.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

.toolbar{display:flex;gap:.5rem;margin-bottom:.9rem;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:160px;padding:.6rem .85rem;border:1.5px solid #ddd;border-radius:10px;font-size:.9rem;background:#fff}
.toolbar button{padding:.6rem 1rem;border:0;border-radius:10px;background:#eee;font-weight:600;font-size:.85rem;cursor:pointer}
.toolbar button.primary{background:#ff5500;color:#fff}

h1{font-size:1.2rem;margin:0 0 .35rem}
.meta{font-size:.85rem;color:#666;margin-bottom:.8rem}

.lead-card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:.7rem;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.lead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;flex-wrap:wrap}
.lead-top strong{font-size:.95rem;word-break:break-all}
.badge-new{background:#e8f5e9;color:#2e7d32;font-size:.68rem;font-weight:700;padding:.18rem .45rem;border-radius:6px;margin-left:.35rem;vertical-align:middle}
.lead-meta{font-size:.82rem;color:#555;margin-top:.4rem;line-height:1.5}
.lead-actions{display:flex;gap:.4rem;margin-top:.65rem;flex-wrap:wrap}
.lead-actions a,.lead-actions button{font-size:.78rem;font-weight:600;padding:.35rem .7rem;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
.btn-wa-sm{background:#25d366;color:#fff}
.btn-mail{background:#e3f2fd;color:#1565c0}
.btn-copy{background:#f5f5f5;color:#333}
.when{font-size:.75rem;color:#999;white-space:nowrap}

.card{background:#fff;border-radius:14px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card img.main{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:.6rem}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:.7rem;padding-bottom:2px}
.thumbs img{width:68px;height:50px;object-fit:cover;border-radius:6px;flex-shrink:0}
.price{color:#ff5500;font-weight:800;font-size:1.2rem}
.card h3{font-size:1.05rem;margin:.25rem 0}
.card .meta{margin:.2rem 0}
.desc-box{background:#fafafa;border-radius:8px;padding:.65rem .8rem;font-size:.85rem;color:#444;margin:.5rem 0;line-height:1.4;max-height:90px;overflow:hidden}
.actions{display:flex;gap:.5rem;margin-top:.9rem}
.actions button{flex:1;padding:.75rem;border:0;border-radius:10px;font-weight:700;cursor:pointer;color:#fff;font-size:.9rem}
.ok{background:#2e7d32}.no{background:#c62828}
.actions button:disabled{opacity:.55;cursor:wait}

.empty{text-align:center;padding:2.5rem 1rem;color:#888;background:#fff;border-radius:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:.7rem 1.3rem;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:520px){
  .stats{grid-template-columns:1fr 1fr 1fr;gap:.5rem}
  .stat .n{font-size:1.25rem}
}
</style>
</head>
<body>
<header>
  <strong>● Admin ZonaProp</strong>
  <div>
    <a href="index.html">Ver sitio</a>
    <span style="opacity:.4;margin:0 .4rem">·</span>
    <a href="#" id="btnLogout" style="display:none">Salir</a>
  </div>
</header>

<div class="wrap" id="app">
  <div class="login" id="loginBox">
    <h2>Acceso admin</h2>
    <p>Ingresá la clave para administrar leads y publicaciones.</p>
    <input id="pass" type="password" placeholder="Clave admin" autocomplete="current-password"/>
    <button type="button" id="btnLogin">Entrar</button>
    <div class="err" id="loginErr">Clave incorrecta</div>
  </div>

  <div id="panel" style="display:none">
    <div class="stats" id="stats">
      <div class="stat"><div class="n" id="sLeads">—</div><div class="l">Visitantes</div></div>
      <div class="stat orange"><div class="n" id="sPending">—</div><div class="l">Pendientes</div></div>
      <div class="stat green"><div class="n" id="sListings">—</div><div class="l">Publicados</div></div>
    </div>

    <div class="tabs">
      <button type="button" class="on" data-tab="leads">Visitantes</button>
      <button type="button" data-tab="pending">Pendientes</button>
    </div>

    <div id="tab-leads">
      <h1>Visitantes que ingresaron</h1>
      <p class="meta" id="leadsCount"></p>
      <div class="toolbar">
        <input type="search" id="leadSearch" placeholder="Buscar email o teléfono..."/>
        <button type="button" id="btnRefreshLeads">Actualizar</button>
      </div>
      <div id="leadsList"></div>
    </div>

    <div id="tab-pending" style="display:none">
      <h1>Pendientes de aprobación</h1>
      <p class="meta" id="count"></p>
      <div class="toolbar">
        <button type="button" class="primary" id="btnRefreshPending">Actualizar</button>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';
const ADMIN_PASS = 'zonaprop2026';
let cachedDB = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

if (sessionStorage.getItem('zp_admin') === '1') showPanel();

document.getElementById('btnLogin').onclick = function(){
  if (document.getElementById('pass').value === ADMIN_PASS) {
    sessionStorage.setItem('zp_admin', '1');
    showPanel();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
};

document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnLogin').click();
});

document.getElementById('btnLogout').onclick = function(e){
  e.preventDefault();
  sessionStorage.removeItem('zp_admin');
  location.reload();
};

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const tab = btn.dataset.tab;
    document.getElementById('tab-leads').style.display = tab === 'leads' ? 'block' : 'none';
    document.getElementById('tab-pending').style.display = tab === 'pending' ? 'block' : 'none';
  };
});

async function loadDB(){
  const r = await fetch(DB_URL + '?t=' + Date.now());
  const db = await r.json();
  cachedDB = {
    listings: Array.isArray(db.listings) ? db.listings : [],
    pending: Array.isArray(db.pending) ? db.pending : [],
    leads: Array.isArray(db.leads) ? db.leads : []
  };
  return cachedDB;
}

async function saveDB(db){
  const r = await fetch(DB_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(db)
  });
  if (!r.ok) throw new Error('save failed');
  cachedDB = db;
}

function updateStats(db) {
  document.getElementById('sLeads').textContent = db.leads.length;
  document.getElementById('sPending').textContent = db.pending.length;
  document.getElementById('sListings').textContent = db.listings.length;
}

async function showPanel(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('btnLogout').style.display = 'inline';
  const db = await loadDB();
  updateStats(db);
  await renderLeads();
  await renderPending();
}

function formatPhone(tel) {
  const n = (tel || '').replace(/\D/g, '');
  if (n.length < 8) return tel || '—';
  return tel;
}

function waLink(tel) {
  let n = (tel || '').replace(/\D/g, '');
  if (n.length < 8) return null;
  if (!n.startsWith('54')) n = '549' + n.replace(/^0/, '');
  return 'https://wa.me/' + n;
}

async function renderLeads(){
  const db = cachedDB || await loadDB();
  const list = document.getElementById('leadsList');
  const leads = db.leads || [];
  const q = (document.getElementById('leadSearch').value || '').trim().toLowerCase();

  let filtered = leads;
  if (q) {
    filtered = leads.filter(l =>
      (l.email || '').toLowerCase().includes(q) ||
      (l.telefono || '').includes(q)
    );
  }

  document.getElementById('leadsCount').textContent =
    filtered.length + ' de ' + leads.length + ' visitante(s)';

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">' + (q ? 'No hay resultados para esa búsqueda.' : 'Todavía no ingresó nadie.') + '</div>';
    return;
  }

  list.innerHTML = filtered.map((l, i) => {
    const when = l.cuando
      ? new Date(l.cuando).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' })
      : '';
    const isNew = leads.indexOf(l) < 5;
    const wa = waLink(l.telefono);
    const page = (l.pagina || '').replace('https://zonaprop.github.io/premium/', '') || 'inicio';

    return `<div class="lead-card">
      <div class="lead-top">
        <div>
          <strong>${l.email || '—'}</strong>${isNew ? '<span class="badge-new">nuevo</span>' : ''}
        </div>
        <div class="when">${when}</div>
      </div>
      <div class="lead-meta">
        📱 ${formatPhone(l.telefono)}<br>
        Origen: ${l.origen || 'Directo'} · Página: ${page}
      </div>
      <div class="lead-actions">
        ${wa ? `<a class="btn-wa-sm" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${l.email ? `<a class="btn-mail" href="mailto:${l.email}">Email</a>` : ''}
        <button class="btn-copy" type="button" data-copy="${(l.email || '') + ' | ' + (l.telefono || '')}">Copiar</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.btn-copy').forEach(btn => {
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        toast('Copiado');
      } catch (e) {
        toast('No se pudo copiar');
      }
    };
  });
}

async function renderPending(){
  const db = cachedDB || await loadDB();
  const list = document.getElementById('list');
  document.getElementById('count').textContent = db.pending.length + ' pendiente(s)';

  if (!db.pending.length) {
    list.innerHTML = '<div class="empty">No hay publicaciones pendientes.</div>';
    return;
  }

  list.innerHTML = db.pending.map((d) => {
    const photos = d.photos || (d.main ? [d.main] : []);
    const main = photos[0] || '';
    const wa = waLink(d.contacto_tel);

    return `<div class="card" data-id="${d.id}">
      ${main ? `<img class="main" src="${main}" alt="">` : ''}
      ${photos.length > 1 ? `<div class="thumbs">${photos.slice(0,8).map(p=>`<img src="${p}" alt="">`).join('')}</div>` : ''}
      <div class="price">${d.price || 'Consultar'}</div>
      <h3>${d.title || 'Sin título'}</h3>
      <div class="meta">${d.zona || '—'} · ${d.ambientes || ''} · ${photos.length} fotos</div>
      <div class="meta">
        👤 ${d.contacto_nombre || '—'} ·
        ${d.contacto_tel || ''} ·
        ${d.contacto_email || ''}
        ${wa ? ` · <a href="${wa}" target="_blank" rel="noopener" style="color:#25d366;font-weight:600">WhatsApp</a>` : ''}
      </div>
      <div class="meta">ID: ${d.id}</div>
      ${d.desc ? `<div class="desc-box">${d.desc}</div>` : ''}
      <div class="actions">
        <button class="ok" type="button" data-act="ok" data-id="${d.id}">✓ Aprobar</button>
        <button class="no" type="button" data-act="no" data-id="${d.id}">✕ Rechazar</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;

      if (act === 'no' && !confirm('¿Rechazar esta publicación? Se eliminará de la cola.')) return;

      btn.disabled = true;
      const other = btn.parentElement.querySelector('button[data-act="' + (act === 'ok' ? 'no' : 'ok') + '"]');
      if (other) other.disabled = true;

      try {
        const db = await loadDB();
        const i = db.pending.findIndex(x => x.id === id);
        if (i < 0) {
          await renderPending();
          return;
        }
        const item = db.pending[i];
        db.pending.splice(i, 1);
        if (act === 'ok') {
          item.aprobado = true;
          item.aprobado_en = new Date().toISOString();
          db.listings.unshift(item);
          toast('Publicación aprobada');
        } else {
          toast('Publicación rechazada');
        }
        await saveDB(db);
        updateStats(db);
        await renderPending();
      } catch (e) {
        alert('Error al guardar. Reintentá.');
        btn.disabled = false;
        if (other) other.disabled = false;
      }
    };
  });
}

document.getElementById('leadSearch').addEventListener('input', () => renderLeads());
document.getElementById('btnRefreshLeads').onclick = async () => {
  await loadDB();
  updateStats(cachedDB);
  await renderLeads();
  toast('Actualizado');
};
document.getElementById('btnRefreshPending').onclick = async () => {
  await loadDB();
  updateStats(cachedDB);
  await renderPending();
  toast('Actualizado');
};

// deep link ?id=
const focusId = new URLSearchParams(location.search).get('id');
if (focusId && sessionStorage.getItem('zp_admin') === '1') {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  document.querySelector('[data-tab="pending"]').classList.add('on');
  document.getElementById('tab-leads').style.display = 'none';
  document.getElementById('tab-pending').style.display = 'block';
  setTimeout(() => {
    const el = document.querySelector('[data-id="'+focusId+'"]');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 600);
}
</script>
</body>
</html>
