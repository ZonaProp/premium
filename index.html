<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Departamentos · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:1rem;text-align:center;font-weight:700}
header span{color:#ff5500}
h1{text-align:center;padding:1.2rem 1rem .4rem;font-size:1.35rem;font-weight:800}
.search{max-width:1140px;margin:0 auto 1rem;padding:0 1rem}
.search-box{background:#fff;border-radius:14px;padding:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.search-row{display:flex;flex-wrap:wrap;gap:.6rem}
.search-row input,.search-row select{flex:1;min-width:120px;padding:.65rem .8rem;border:1px solid #ddd;border-radius:10px;font-size:.92rem;background:#fafafa}
.search-row button{padding:.65rem 1.1rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:700;font-size:.92rem;cursor:pointer}
.search-row button.sec{background:#eee;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:.35rem .75rem;font-size:.8rem;cursor:pointer}
.chips button.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.meta{max-width:1140px;margin:0 auto .5rem;padding:0 1rem;font-size:.85rem;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.2rem;max-width:1140px;margin:0 auto;padding:0 1rem 2.5rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;flex-direction:column}
.card a{text-decoration:none;color:inherit;flex:1}
.card-img{aspect-ratio:4/3;background:#eee;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:.85rem 1rem .4rem}
.price{font-size:1.2rem;font-weight:800;margin-bottom:.2rem;color:#ff5500}
h2{font-size:.92rem;font-weight:700;line-height:1.3}
.specs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.spec{background:#f0f0f0;border-radius:999px;padding:.25rem .55rem;font-size:.72rem;font-weight:600;color:#444}
.badge{font-size:.75rem;color:#666;margin-top:.35rem}
.card-actions{display:flex;gap:.45rem;padding:.7rem 1rem 1rem}
.btn-o,.btn-g{flex:1;text-align:center;padding:.5rem;border-radius:999px;font-size:.82rem;font-weight:700;text-decoration:none;color:#fff}
.btn-o{background:#ff5500}
.btn-g{background:#25d366}
.more-wrap{max-width:1140px;margin:0 auto 1.5rem;padding:0 1rem;text-align:center}
.more-wrap button{border:0;background:#ff5500;color:#fff;border-radius:999px;padding:.75rem 1.4rem;font-size:.95rem;font-weight:700;cursor:pointer}
footer{text-align:center;padding:1.2rem;color:#666;font-size:.85rem}
.loading{text-align:center;padding:3rem;color:#888}
.empty{text-align:center;padding:2rem;color:#888}
</style>
</head>
<body>
<header><span>●</span> ZonaProp Premium</header>
<h1>Departamentos en alquiler</h1>
<div class="search">
  <div class="search-box">
    <div class="search-row">
      <input id="q" type="search" placeholder="Zona o barrio (ej. Recoleta, Palermo)"/>
      <select id="precio">
        <option value="">Cualquier precio</option>
        <option value="0-300000">Hasta $300.000</option>
        <option value="300000-600000">$300.000 – $600.000</option>
        <option value="600000-1000000">$600.000 – $1.000.000</option>
        <option value="1000000-999999999">Más de $1.000.000</option>
      </select>
      <button id="btnBuscar" type="button">Buscar</button>
      <button id="btnLimpiar" class="sec" type="button">Limpiar</button>
    </div>
    <div class="chips" id="chips">
      <button type="button" data-z="Recoleta">Recoleta</button>
      <button type="button" data-z="Palermo">Palermo</button>
      <button type="button" data-z="Belgrano">Belgrano</button>
      <button type="button" data-z="Nuñez">Nuñez</button>
      <button type="button" data-z="Avellaneda">Avellaneda</button>
      <button type="button" data-z="Balvanera">Balvanera</button>
      <button type="button" data-z="Villa Urquiza">Villa Urquiza</button>
      <button type="button" data-z="Caballito">Caballito</button>
      <button type="button" data-z="Flores">Flores</button>
    </div>
  </div>
</div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"><div class="loading">Cargando...</div></div>
<div class="more-wrap" id="moreWrap" style="display:none">
  <button type="button" id="btnVerTodo">Ver todo el listado</button>
</div>
<footer id="footer">ZonaProp Premium</footer>
<script>
const ADMIN_EMAIL = 'informezonaprop@gmail.com';
const HOME_LIMIT = 20;
let ALL = [];
let showAll = false;

(function notifyAdminVisit(){
  try {
    if (sessionStorage.getItem('zp_visit_ok')) return;
    sessionStorage.setItem('zp_visit_ok', '1');
    const payload = {
      _subject: 'ZonaProp Premium · Nueva visita',
      mensaje: 'Alguien entró al sitio ZonaProp Premium',
      pagina: location.href,
      cuando: new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' }),
      userAgent: navigator.userAgent.slice(0, 180),
      idioma: navigator.language || '',
      _template: 'table',
      _captcha: 'false'
    };
    fetch('https://formsubmit.co/ajax/' + ADMIN_EMAIL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch (e) {}
})();

function parsePrice(p){if(!p)return 0;const n=String(p).replace(/[^0-9]/g,'');return n?parseInt(n,10):0}
function cardHTML(d){
  const specs=['Alquiler',d.ambientes,d.dormitorios,d.m2,d.banos].filter(Boolean);
  return `<article class="card">
    <a href="depto.html?id=${d.id}">
      <div class="card-img">${d.main?`<img src="${d.main}" alt="" loading="lazy">`:''}</div>
      <div class="card-body">
        <div class="price">${d.price}</div>
        <h2>${d.title}</h2>
        <div class="specs">${specs.map(s=>`<span class="spec">${s}</span>`).join('')}</div>
        <div class="badge">${d.zona?d.zona+' · ':''}${(d.photos||[]).length} fotos</div>
      </div>
    </a>
    <div class="card-actions">
      <a class="btn-o" href="depto.html?id=${d.id}">Ver</a>
      <a class="btn-g" href="https://wa.me/5491125692598?text=${encodeURIComponent('Hola! Quiero info de '+d.title)}">WhatsApp</a>
    </div>
  </article>`;
}
function render(list,label){
  const grid=document.getElementById('grid');
  grid.innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">No hay resultados. Probá otra zona o precio.</div>';
  document.getElementById('meta').textContent=label;
  document.getElementById('footer').textContent=list.length+' departamentos · ZonaProp Premium';
}
function applyFilters(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const pr=document.getElementById('precio').value;
  let list=ALL.slice();
  if(q){
    list=list.filter(d=>{
      const t=(d.title||'').toLowerCase();
      const z=(d.zona||'').toLowerCase();
      return t.includes(q)||z.includes(q);
    });
  }
  if(pr){
    const [min,max]=pr.split('-').map(Number);
    list=list.filter(d=>{const v=parsePrice(d.price);return v>=min&&v<=max});
  }
  const searching=!!(q||pr);
  const more=document.getElementById('moreWrap');
  if(!searching && !showAll){
    render(list.slice(0,HOME_LIMIT),'Mostrando 20 destacados');
    more.style.display=list.length>HOME_LIMIT?'block':'none';
    document.getElementById('btnVerTodo').textContent='Ver todo el listado ('+list.length+')';
  } else {
    render(list, searching ? (list.length+' resultado'+(list.length===1?'':'s')+(q?' para "'+q+'"':'')) : ('Listado completo · '+list.length+' departamentos'));
    more.style.display='none';
  }
}
fetch('data.json').then(r=>r.json()).then(data=>{
  ALL=data;
  applyFilters();
  document.getElementById('btnBuscar').onclick=()=>{showAll=false;applyFilters()};
  document.getElementById('btnLimpiar').onclick=()=>{
    document.getElementById('q').value='';
    document.getElementById('precio').value='';
    document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));
    showAll=false;
    applyFilters();
  };
  document.getElementById('btnVerTodo').onclick=()=>{showAll=true;applyFilters();window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){showAll=false;applyFilters()}});
  document.getElementById('precio').addEventListener('change',()=>{showAll=false;applyFilters()});
  document.querySelectorAll('#chips button').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('q').value=btn.dataset.z;
      showAll=false;
      applyFilters();
    };
  });
}).catch(e=>{
  document.getElementById('grid').innerHTML='<div class="loading">Error cargando datos</div>';
});
</script>
</body>
</html>
