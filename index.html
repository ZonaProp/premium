<div class="meta" id="meta">Cargando...</div>
<div class="grid" id="grid"><div class="loading">Cargando departamentos...</div></div>
<script>
const DB_URL = "https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE";
Promise.all([
  fetch("data.json").then(r=>r.json()).catch(()=>[]),
  fetch(DB_URL).then(r=>r.json()).then(db=>Array.isArray(db.listings)?db.listings:[]).catch(()=>[])
]).then(function(results){
  const ALL = (results[1]||[]).concat(results[0]||[]);
  const seen = new Set();
  const list = ALL.filter(d => {
    const id = String(d.id||"");
    if (!id || seen.has(id)) return false;
    seen.add(id);
    return true;
  });
  document.getElementById("meta").textContent = list.length + " departamentos disponibles";
  if (!list.length) {
    document.getElementById("grid").innerHTML = '<div class="loading">No hay departamentos disponibles.</div>';
    return;
  }
  document.getElementById("grid").innerHTML = list.map(d => {
    const img = (d.photos && d.photos[0]) || d.main || "logo.svg";
    const specs = [d.ambientes, d.dormitorios, d.banos, d.m2].filter(Boolean).map(s => '<span class="spec">'+s+'</span>').join("");
    const zona = d.zona ? '<div class="zona">📍 '+d.zona+'</div>' : '';
    return '<div class="card"><a href="depto.html?id='+encodeURIComponent(d.id)+'"><div class="card-img"><img src="'+img+'" alt="" loading="lazy" decoding="async"></div><div class="card-body"><div class="price">'+(d.price||"Consultar")+'</div><h2>'+(d.title||"Departamento")+'</h2>'+zona+'<div class="specs">'+specs+'</div></div></a></div>';
  }).join("");
}).catch(function(){
  document.getElementById("grid").innerHTML = '<div class="loading">Error cargando datos</div>';
});
</script>
