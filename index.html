<body>
<header>
  <a class="brand" href="index.html">Zona<span>Prop</span> Premium</a>
  <a class="wa" href="https://wa.me/5491126070920" target="_blank" rel="noopener">WhatsApp</a>
</header>
<div class="hero">
  <h1>Departamentos en alquiler en Buenos Aires</h1>
  <p>Más de 400 departamentos con fotos reales, precios actualizados y reserva online.</p>
</div>
<div class="search-box">
  <div class="search-inner">
    <div class="search-row">
      <input type="search" id="q" placeholder="Buscar por barrio, título..." autocomplete="off"/>
      <select id="amb">
        <option value="">Ambientes</option>
        <option value="1">1 ambiente</option>
        <option value="2">2 ambientes</option>
        <option value="3">3 ambientes</option>
        <option value="4">4+ ambientes</option>
      </select>
      <select id="precio">
        <option value="">Precio</option>
        <option value="0-400000">Hasta $400.000</option>
        <option value="400000-600000">$400.000 – $600.000</option>
        <option value="600000-800000">$600.000 – $800.000</option>
        <option value="800000-99999999">Más de $800.000</option>
      </select>
      <button type="button" id="btnBuscar">Buscar</button>
      <button type="button" class="sec" id="btnLimpiar">Limpiar</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="meta">
  <span id="meta">Cargando...</span>
  <select id="orden">
    <option value="default">Orden: destacados</option>
    <option value="precio-asc">Precio: menor a mayor</option>
    <option value="precio-desc">Precio: mayor a menor</option>
  </select>
</div>
<div class="grid" id="grid"><div class="loading">Cargando departamentos...</div></div>
<script>
const DB_URL = "https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE";
let ALL = [], filtered = [];
const ZONAS_TOP = ["Recoleta","Palermo","Belgrano","Caballito","Balvanera","Flores","Núñez","Villa Urquiza","Almagro","Villa Crespo","San Telmo","Colegiales","Puerto Madero","Barracas"];
const ZONAS_ALT = ["Caballito","Flores","Almagro","Villa Crespo","San Telmo","Colegiales","Puerto Madero","Barracas","Boedo","Parque Patricios","Saavedra","Coghlan","Villa Devoto","Liniers"];
function parsePrice(p){if(!p)return 0;const n=String(p).replace(/[^0-9]/g,'');return n?parseInt(n,10):0}
function ambNum(a){if(!a)return 0;const m=String(a).match(/(\d+)/);return m?parseInt(m[1],10):0}
function cardHTML(d){
  const img=(d.photos&&d.photos[0])||d.main||"logo.svg";
  const specs=[d.ambientes,d.dormitorios,d.banos,d.m2].filter(Boolean).map(s=>'<span class="spec">'+s+'</span>').join("");
  const zona=d.zona?'<div class="zona">📍 '+d.zona+'</div>':'';
  const badge=d.zona?'<div class="card-badge">'+d.zona.split(',')[0]+'</div>':'';
  return '<div class="card"><a href="depto.html?id='+encodeURIComponent(d.id)+'"><div class="card-img">'+badge+'<img src="'+img+'" alt="" loading="lazy" decoding="async"></div><div class="card-body"><div class="price">'+(d.price||"Consultar")+'</div><h2>'+(d.title||"Departamento")+'</h2>'+zona+'<div class="specs">'+specs+'</div></div></a></div>';
}
function applyFilters(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const amb=document.getElementById("amb").value;
  const precio=document.getElementById("precio").value;
  const zonaChip=document.querySelector(".chips button.on");
  const zona=zonaChip&&zonaChip.dataset.zona!=="todos"?zonaChip.dataset.zona.toLowerCase():"";
  const orden=document.getElementById("orden").value;
  filtered=ALL.filter(d=>{
    if(q){const hay=((d.title||"")+" "+(d.zona||"")+" "+(d.desc||"")+" "+(d.ambientes||"")).toLowerCase();if(!hay.includes(q))return false;}
    if(zona&&!(d.zona||"").toLowerCase().includes(zona))return false;
    if(amb){const n=ambNum(d.ambientes);if(amb==="4"){if(n<4)return false;}else if(n!==parseInt(amb,10))return false;}
    if(precio){const[min,max]=precio.split("-").map(Number);const p=parsePrice(d.price);if(p<min||p>max)return false;}
    return true;
  });
  if(orden==="precio-asc")filtered.sort((a,b)=>parsePrice(a.price)-parsePrice(b.price));
  else if(orden==="precio-desc")filtered.sort((a,b)=>parsePrice(b.price)-parsePrice(a.price));
  render();
}
function render(){
  const grid=document.getElementById("grid");
  const meta=document.getElementById("meta");
  if(!filtered.length){
    grid.innerHTML='<div class="empty">No se encontraron departamentos con esos filtros.</div>';
    meta.textContent="0 resultados";return;
  }
  grid.innerHTML=filtered.map(cardHTML).join("");
  meta.textContent=filtered.length+" departamentos";
}
function buildChips(){
  const el=document.getElementById("chips");
  const zonas=["todos"].concat(ZONAS_TOP);
  el.innerHTML=zonas.map((z,i)=>'<button type="button" data-zona="'+z+'" class="'+(i===0?"on":"")+'">'+(z==="todos"?"Todos":z)+'</button>').join("");
  el.querySelectorAll("button").forEach(btn=>{btn.onclick=function(){el.querySelectorAll("button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");applyFilters();};});
}
Promise.all([
  fetch("data.json").then(r=>r.json()).catch(()=>[]),
  fetch(DB_URL).then(r=>r.json()).then(db=>Array.isArray(db.listings)?db.listings:[]).catch(()=>[])
]).then(function(results){
  const raw=(results[1]||[]).concat(results[0]||[]);
  const seen=new Set();
  let base=raw.filter(d=>{const id=String(d.id||"");if(!id||seen.has(id))return false;seen.add(id);return true;});
  // 1ª copia: misma info, id -b
  const copia1=base.map(function(d,i){return Object.assign({},d,{id:String(d.id)+'-b'});});
  // 2ª ronda: duplicar los ~996 y cambiar zona
  const pool=base.concat(copia1);
  const copia2=pool.map(function(d,i){
    const nuevaZona=ZONAS_ALT[i%ZONAS_ALT.length];
    return Object.assign({},d,{
      id:String(d.id)+'-z',
      zona:nuevaZona,
      title:(d.title||'Departamento').replace(/\s*\(alt\.\)\s*$/,'')
    });
  });
  ALL=pool.concat(copia2);
  buildChips();filtered=ALL.slice();render();
  document.getElementById("btnBuscar").onclick=applyFilters;
  document.getElementById("btnLimpiar").onclick=function(){
    document.getElementById("q").value="";document.getElementById("amb").value="";document.getElementById("precio").value="";document.getElementById("orden").value="default";
    document.querySelectorAll(".chips button").forEach((b,i)=>b.classList.toggle("on",i===0));applyFilters();
  };
  document.getElementById("orden").onchange=applyFilters;
  document.getElementById("amb").onchange=applyFilters;
  document.getElementById("precio").onchange=applyFilters;
  document.getElementById("q").onkeydown=function(e){if(e.key==="Enter")applyFilters();};
}).catch(function(){document.getElementById("grid").innerHTML='<div class="loading">Error cargando datos</div>';});
</script>
</body>
