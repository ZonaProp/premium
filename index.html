<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Departamentos · ZonaProp Premium</title>

<!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
<meta property="og:type" content="website"/>

<meta property="og:description" content="Encontrá departamentos en alquiler en Recoleta, Palermo, Belgrano y más. Listado actualizado de propiedades en Buenos Aires."/>

<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="ZonaProp Premium · Departamentos en alquiler"/>
<meta name="twitter:description" content="Encontrá departamentos en alquiler en Recoleta, Palermo, Belgrano y más. Listado actualizado de propiedades en Buenos Aires."/>
<meta name="twitter:image" content="https://zonaprop.github.io/premium/logo.svg"/>

<meta name="description" content="Encontrá departamentos en alquiler en Recoleta, Palermo, Belgrano y más. Listado actualizado de propiedades en Buenos Aires."/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222}
body.locked{overflow:hidden}
header{background:#1a1a2e;color:#fff;padding:1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
header .brand{font-weight:700;font-size:1.05rem}
header span{color:#ff5500}
header a.pub{color:#fff;text-decoration:none;background:#ff5500;padding:.5rem .9rem;border-radius:999px;font-size:.85rem;font-weight:700}
h1{text-align:center;padding:1.3rem 1rem .5rem;font-size:1.4rem;font-weight:800}
.search{max-width:1140px;margin:0 auto 1rem;padding:0 1rem}
.search-box{background:#fff;border-radius:14px;padding:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.search-row{display:flex;flex-wrap:wrap;gap:.6rem}
.search-row input,.search-row select{flex:1;min-width:120px;padding:.7rem .85rem;border:1px solid #ddd;border-radius:10px;font-size:.92rem;background:#fafafa}
.search-row button{padding:.7rem 1.15rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:700;font-size:.92rem;cursor:pointer}
.search-row button.sec{background:#eee;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:.38rem .8rem;font-size:.8rem;cursor:pointer;transition:all .15s}
.chips button.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.meta{max-width:1140px;margin:0 auto .6rem;padding:0 1rem;font-size:.85rem;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;max-width:1140px;margin:0 auto;padding:0 1rem 2.5rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card a{text-decoration:none;color:inherit;flex:1}
.card-img{aspect-ratio:4/3;background:#eee;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:10px;left:10px;background:rgba(26,26,46,.85);color:#fff;font-size:.7rem;font-weight:700;padding:.25rem .55rem;border-radius:6px}
.card-body{padding:.9rem 1rem .35rem}
.price{font-size:1.25rem;font-weight:800;margin-bottom:.25rem;color:#ff5500}
h2{font-size:.95rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.specs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.spec{background:#f0f0f0;border-radius:999px;padding:.28rem .6rem;font-size:.72rem;font-weight:600;color:#444}
.badge{font-size:.78rem;color:#666;margin-top:.4rem}
.card-actions{display:flex;gap:.5rem;padding:.75rem 1rem 1rem}
.btn-o,.btn-g{flex:1;text-align:center;padding:.55rem;border-radius:999px;font-size:.84rem;font-weight:700;text-decoration:none;color:#fff}
.btn-o{background:#ff5500}
.btn-g{background:#25d366}
.more-wrap{max-width:1140px;margin:0 auto 1.8rem;padding:0 1rem;text-align:center}
.more-wrap button{border:0;background:#ff5500;color:#fff;border-radius:999px;padding:.85rem 1.6rem;font-size:.98rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(255,85,0,.25)}
footer{text-align:center;padding:1.3rem;color:#666;font-size:.85rem}
.loading{text-align:center;padding:3rem;color:#888}
.empty{text-align:center;padding:2.5rem 1rem;color:#888;font-size:.95rem}
.gate{position:fixed;inset:0;background:rgba(15,15,25,.93);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}
.gate-box{background:#fff;border-radius:18px;padding:1.5rem 1.35rem 1.4rem;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gate-box h2{font-size:1.2rem;margin-bottom:.4rem}
.gate-box p{font-size:.9rem;color:#555;margin-bottom:1.1rem;line-height:1.45}
.gate-box label{display:block;font-size:.8rem;font-weight:600;margin:.6rem 0 .28rem}
.gate-box input{width:100%;padding:.75rem .85rem;border:1.5px solid #ddd;border-radius:10px;font-size:1rem}
.gate-box button{width:100%;margin-top:1.1rem;padding:.9rem;border:0;border-radius:12px;background:#ff5500;color:#fff;font-weight:800;font-size:1.02rem;cursor:pointer}
.gate-box button:disabled{opacity:.6;cursor:wait}
.gate-err{color:#c62828;font-size:.82rem;margin-top:.55rem;display:none}
.gate-ok{color:#2e7d32;font-size:.82rem;margin-top:.55rem;display:none}
</style>
</head>
<body class="locked">
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Ingresá para ver departamentos</h2>
    <p>Completá tus datos para acceder al listado completo. Email y teléfono son obligatorios.</p>
    <label for="gEmail">Email *</label>
    <input id="gEmail" type="email" name="email" placeholder="tunombre@email.com" required autocomplete="email"/>
    <label for="gPhone">Teléfono / WhatsApp *</label>
    <input id="gPhone" type="tel" name="telefono" placeholder="11 1234-5678" required autocomplete="tel"/>
    <div class="gate-err" id="gateErr">Completá email y teléfono válidos.</div>
    <div class="gate-ok" id="gateOk">Datos enviados. Entrando...</div>
    <button type="button" id="gateBtn">Ver departamentos</button>
  </div>
</div>
<div class="main-app" id="mainApp">
<header>
  <div class="brand"><span>●</span> ZonaProp Premium</div>
  <a class="pub" href="publicar.html">+ Publicar</a>
</header>
<h1>Departamentos en alquiler</h1>
<div class="search">
  <div class="search-box">
    <div class="search-row">
      <input id="q" type="search" placeholder="Zona o barrio (ej. Recoleta, Palermo)"/>
      <select id="precio">
        <option value="">Cualquier precio</option>
        <option value="0-500000">Hasta $500.000</option>
        <option value="500000-700000">$500.000 – $700.000</option>
        <option value="700000-900000">$700.000 – $900.000</option>
        <option value="900000-999999999">Más de $900.000</option>
      </select>
      <select id="ambientes">
        <option value="">Cualquier ambientes</option>
        <option value="1">1 ambiente</option>
        <option value="2">2 ambientes</option>
        <option value="3">3 ambientes</option>
        <option value="4">4 ambientes</option>
        <option value="5">5+ ambientes</option>
      </select>
      <button id="btnBuscar" type="button">Buscar</button>
      <button id="btnLimpiar" class="sec" type="button">Limpiar</button>
    </div>
    <div class="chips" id="chips">
      <button type="button" data-z="Recoleta">Recoleta</button>
      <button type="button" data-z="Palermo">Palermo</button>
      <button type="button" data-z="Belgrano">Belgrano</button>
      <button type="button" data-z="Nuñez">Nuñez</button>
      <button type="button" data-z="Avellaneda">Avellaneda</button>
      <button type="button" data-z="Balvanera">Balvanera</button>
      <button type="button" data-z="Villa Urquiza">Villa Urquiza</button>
      <button type="button" data-z="Caballito">Caballito</button>
      <button type="button" data-z="Flores">Flores</button>
    </div>
  </div>
</div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"><div class="loading">Cargando departamentos...</div></div>
<div class="more-wrap" id="moreWrap" style="display:none">
  <button type="button" id="btnVerTodo">Ver todo el listado</button>
</div>
<footer id="footer">ZonaProp Premium</footer>
</div>
<script>
const ADMIN_EMAIL = 'informezonaprop@gmail.com';
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';
const HOME_LIMIT = 24;
let ALL = [];
let showAll = false;

function unlockSite(){
  document.getElementById('gate').style.display = 'none';
  document.body.classList.remove('locked');
}

if (localStorage.getItem('zp_lead_ok') === '1') {
  unlockSite();
}

document.getElementById('gateBtn').onclick = function(){
  const email = (document.getElementById('gEmail').value || '').trim();
  const phone = (document.getElementById('gPhone').value || '').trim();
  const err = document.getElementById('gateErr');
  const ok = document.getElementById('gateOk');
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const phoneOk = phone.replace(/\D/g,'').length >= 8;
  if (!emailOk || !phoneOk) {
    err.style.display = 'block';
    ok.style.display = 'none';
    return;
  }
  err.style.display = 'none';
  const btn = document.getElementById('gateBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const lead = {
    email: email,
    telefono: phone,
    cuando: new Date().toISOString(),
    pagina: location.href,
    origen: document.referrer || 'Directo',
    dispositivo: navigator.userAgent.slice(0, 180)
  };

  fetch(DB_URL + '?t=' + Date.now())
    .then(r => r.json())
    .then(db => {
      const listings = Array.isArray(db.listings) ? db.listings : [];
      const pending = Array.isArray(db.pending) ? db.pending : [];
      const leads = Array.isArray(db.leads) ? db.leads : [];
      leads.unshift(lead);
      return fetch(DB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ listings, pending, leads: leads.slice(0, 200) })
      });
    })
    .catch(function(){});

  const fd = new FormData();
  fd.append('_subject', 'ZonaProp Premium · Nuevo contacto');
  fd.append('_template', 'table');
  fd.append('_captcha', 'false');
  fd.append('_url', 'https://zonaprop.github.io/premium/');
  fd.append('mensaje', 'Un visitante completó email y teléfono para entrar al sitio');
  fd.append('email', email);
  fd.append('telefono', phone);
  fd.append('pagina', location.href);
  fd.append('cuando', new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' }));
  fd.append('dispositivo', navigator.userAgent.slice(0, 180));
  fd.append('origen', document.referrer || 'Directo');

  function finish(){
    localStorage.setItem('zp_lead_ok', '1');
    localStorage.setItem('zp_lead_email', email);
    localStorage.setItem('zp_lead_phone', phone);
    ok.style.display = 'block';
    setTimeout(unlockSite, 400);
  }

  fetch('https://formsubmit.co/ajax/' + encodeURIComponent(ADMIN_EMAIL), {
    method: 'POST',
    body: fd,
    headers: { 'Accept': 'application/json' }
  }).then(function(r){
    return r.json().catch(function(){ return {}; });
  }).then(function(){
    finish();
  }).catch(function(){
    finish();
  });
};

function parsePrice(p){if(!p)return 0;const n=String(p).replace(/[^0-9]/g,'');return n?parseInt(n,10):0}

function cardHTML(d){
  const specs=[d.ambientes,d.dormitorios,d.m2,d.banos].filter(Boolean);
  const photoCount = (d.photos && d.photos.length) ? d.photos.length : (d.main ? 1 : 0);
  const badge = d.community ? 'Comunidad' : (d.zona || '');
  const deptoUrl = 'https://zonaprop.github.io/premium/depto.html?id=' + encodeURIComponent(d.id);
  const waText = 'Hola! Quiero info de ' + (d.title || 'este departamento') + '\n\nLink de la publicación: ' + deptoUrl;
  return `<article class="card">
    <a href="depto.html?id=${encodeURIComponent(d.id)}">
      <div class="card-img">
        ${d.main ? `<img src="${d.main}" alt="" loading="lazy">` : ''}
        ${badge ? `<span class="card-badge">${badge}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="price">${d.price || 'Consultar'}</div>
        <h2>${d.title || 'Departamento'}</h2>
        <div class="specs">${specs.map(s=>`<span class="spec">${s}</span>`).join('')}</div>
        <div class="badge">${d.zona && !d.community ? d.zona + ' · ' : ''}${photoCount} fotos</div>
      </div>
    </a>
    <div class="card-actions">
      <a class="btn-o" href="depto.html?id=${encodeURIComponent(d.id)}">Ver</a>
      <a class="btn-g" href="https://wa.me/5491125692598?text=${encodeURIComponent(waText)}">WhatsApp</a>
    </div>
  </article>`;
}

function render(list,label){
  const grid=document.getElementById('grid');
  grid.innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">No hay resultados.<br>Probá otra zona, precio o cantidad de ambientes.</div>';
  document.getElementById('meta').textContent=label;
  document.getElementById('footer').textContent=list.length+' departamentos · ZonaProp Premium';
}

function parseAmbientes(a){
  if(!a) return 0;
  const m=String(a).match(/(\d+)/);
  return m ? parseInt(m[1],10) : 0;
}

function applyFilters(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const pr=document.getElementById('precio').value;
  const amb=document.getElementById('ambientes').value;
  let list=ALL.slice();
  if(q){
    list=list.filter(d=>{
      const t=(d.title||'').toLowerCase();
      const z=(d.zona||'').toLowerCase();
      return t.includes(q)||z.includes(q);
    });
  }
  if(pr){
    const [min,max]=pr.split('-').map(Number);
    list=list.filter(d=>{const v=parsePrice(d.price);return v>=min&&v<=max});
  }
  if(amb){
    const n=parseInt(amb,10);
    list=list.filter(d=>{
      const v=parseAmbientes(d.ambientes);
      if(n===5) return v>=5;
      return v===n;
    });
  }
  const searching=!!(q||pr||amb);
  const more=document.getElementById('moreWrap');
  if(!searching && !showAll){
    render(list.slice(0,HOME_LIMIT),'Mostrando '+Math.min(HOME_LIMIT,list.length)+' destacados');
    more.style.display=list.length>HOME_LIMIT?'block':'none';
    document.getElementById('btnVerTodo').textContent='Ver todo el listado ('+list.length+')';
  } else {
    render(list, searching ? (list.length+' resultado'+(list.length===1?'':'s')+(q?' para "'+q+'"':'')) : ('Listado completo · '+list.length+' departamentos'));
    more.style.display='none';
  }
}

function wireUI(){
  document.getElementById('btnBuscar').onclick=()=>{showAll=false;applyFilters()};
  document.getElementById('btnLimpiar').onclick=()=>{
    document.getElementById('q').value='';
    document.getElementById('precio').value='';
    document.getElementById('ambientes').value='';
    document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));
    showAll=false;
    applyFilters();
  };
  document.getElementById('btnVerTodo').onclick=()=>{showAll=true;applyFilters();window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){showAll=false;applyFilters()}});
  document.getElementById('precio').addEventListener('change',()=>{showAll=false;applyFilters()});
  document.getElementById('ambientes').addEventListener('change',()=>{showAll=false;applyFilters()});
  document.querySelectorAll('#chips button').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('q').value=btn.dataset.z;
      showAll=false;
      applyFilters();
    };
  });
}

Promise.all([
  fetch('data.json').then(r=>r.json()).catch(function(){ return []; }),
  fetch(DB_URL).then(r=>r.json()).then(function(db){ return Array.isArray(db.listings) ? db.listings : []; }).catch(function(){ return []; })
]).then(function(results){
  const base = results[0] || [];
  const community = results[1] || [];
  ALL = community.concat(base);
  applyFilters();
  wireUI();
}).catch(function(){
  document.getElementById('grid').innerHTML='<div class="loading">Error cargando datos</div>';
});
</script>
</body>
</html>
