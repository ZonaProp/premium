<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Departamentos en Belgrano | ZonaProp Premium</title>
<meta name="description" content="Departamentos en alquiler en Belgrano. Contacto WhatsApp 11 5569-2356."/>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f0f0f0;color:#222}.header{background:#1a1a2e;color:#fff;padding:.8rem 1rem}.header a{color:#fff;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:12px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card img{width:100%;height:180px;object-fit:cover}.card .body{padding:12px}.price{font-weight:800;color:#ff5500}.btn{display:block;text-align:center;background:#25d366;color:#fff;padding:.6rem;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="header"><a href="index.html">← ZonaProp Premium</a> · Belgrano</div>
<div class="grid" id="grid"></div>
<script>
const WA='https://wa.me/5491155692356';
fetch('data.json').then(r=>r.json()).then(list=>{
  const items = list.filter(d => /belgrano/i.test(d.zona||'') || /belgrano/i.test(d.title||''));
  const g = document.getElementById('grid');
  if(!items.length){ g.innerHTML='<p style="padding:2rem">No hay departamentos en Belgrano en este momento.</p>'; return; }
  items.forEach(d=>{
    const a = document.createElement('a');
    a.className='card'; a.href='depto.html?id='+encodeURIComponent(d.id);
    a.innerHTML = `<img src="${(d.photos&&d.photos[0])||d.main||''}" alt=""><div class="body"><div class="price">${d.price||'Consultar'}</div><div>${d.title||''}</div><div style="font-size:.85rem;color:#666">${d.zona||''}</div><div class="btn" onclick="event.preventDefault();window.open('${WA}?text='+encodeURIComponent('Hola! Me interesa: '+(d.title||'')+' en Belgrano'),'_blank')">WhatsApp</div></div>`;
    g.appendChild(a);
  });
}).catch(()=>{});
</script>
</body>
</html>
