<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Publicar departamento · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
header a{color:#fff;text-decoration:none;font-size:.95rem}
header .brand{font-weight:800}
header .brand span{color:#ff5500}
.wrap{max-width:560px;margin:0 auto;padding:1.2rem 1rem 2.5rem}
h1{font-size:1.35rem;margin-bottom:.35rem}
.sub{color:#666;font-size:.9rem;margin-bottom:1.2rem;line-height:1.4}
.card{background:#fff;border-radius:14px;padding:1.2rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{display:block;font-size:.82rem;font-weight:600;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1px solid #ddd;border-radius:10px;font-size:1rem;font-family:inherit;background:#fafafa}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{width:100%;margin-top:1.1rem;padding:.9rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:.8rem;font-size:.9rem;display:none}
.msg.ok{color:#2e7d32;display:block}
.msg.err{color:#c62828;display:block}
.note{font-size:.78rem;color:#888;margin-top:.8rem;line-height:1.4}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><span>●</span> ZonaProp Premium</a>
  <a href="index.html">← Volver al listado</a>
</header>
<div class="wrap">
  <h1>Publicar un departamento</h1>
  <p class="sub">Tu aviso se publica online al instante y aparece en el listado.</p>
  <div class="card">
    <label>Título del aviso *</label>
    <input id="titulo" type="text" placeholder="Ej: 3 ambientes en Palermo con balcón" required/>
    <div class="row">
      <div>
        <label>Precio alquiler (ARS) *</label>
        <input id="precio" type="text" placeholder="Ej: 750000" required/>
      </div>
      <div>
        <label>Zona / barrio *</label>
        <input id="zona" type="text" placeholder="Ej: Recoleta" required/>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Ambientes *</label>
        <select id="ambientes">
          <option value="1 amb.">1 amb. / Monoambiente</option>
          <option value="2 amb." selected>2 amb.</option>
          <option value="3 amb.">3 amb.</option>
          <option value="4 amb.">4 amb.</option>
          <option value="5 amb.">5 o más</option>
        </select>
      </div>
      <div>
        <label>Dormitorios</label>
        <input id="dormitorios" type="text" placeholder="Ej: 2"/>
      </div>
    </div>
    <div class="row">
      <div>
        <label>m²</label>
        <input id="m2" type="text" placeholder="Ej: 65"/>
      </div>
      <div>
        <label>Baños</label>
        <input id="banos" type="text" placeholder="Ej: 1"/>
      </div>
    </div>
    <label>Características</label>
    <input id="features" type="text" placeholder="Cochera, balcón, amoblado, etc."/>
    <label>Descripción</label>
    <textarea id="desc" placeholder="Detalles del departamento..."></textarea>
    <label>Links de fotos (una por línea)</label>
    <textarea id="fotos" placeholder="https://...jpg"></textarea>
    <label>Tu nombre *</label>
    <input id="nombre" type="text" placeholder="Nombre y apellido" required/>
    <div class="row">
      <div>
        <label>Tu email *</label>
        <input id="email" type="email" placeholder="tunombre@email.com" required/>
      </div>
      <div>
        <label>Tu WhatsApp *</label>
        <input id="telefono" type="tel" placeholder="11 1234-5678" required/>
      </div>
    </div>
    <button class="btn" type="button" id="btnPub">Publicar ahora</button>
    <div class="msg" id="msg"></div>
    <p class="note">Al publicar, el aviso queda online de inmediato. También se notifica al administrador por email.</p>
  </div>
</div>
<script>
const ADMIN_EMAIL = 'informezonaprop@gmail.com';
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';

function formatPrice(p){
  const n = String(p).replace(/[^0-9]/g,'');
  if (!n) return 'Consultar';
  return '$ ' + Number(n).toLocaleString('es-AR');
}

document.getElementById('btnPub').onclick = async function(){
  const titulo = (document.getElementById('titulo').value||'').trim();
  const precioRaw = (document.getElementById('precio').value||'').trim();
  const zona = (document.getElementById('zona').value||'').trim();
  const ambientes = document.getElementById('ambientes').value;
  const dormitorios = (document.getElementById('dormitorios').value||'').trim();
  const m2 = (document.getElementById('m2').value||'').trim();
  const banos = (document.getElementById('banos').value||'').trim();
  const features = (document.getElementById('features').value||'').trim();
  const desc = (document.getElementById('desc').value||'').trim();
  const fotosTxt = (document.getElementById('fotos').value||'').trim();
  const nombre = (document.getElementById('nombre').value||'').trim();
  const email = (document.getElementById('email').value||'').trim();
  const telefono = (document.getElementById('telefono').value||'').trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnPub');

  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const phoneOk = telefono.replace(/\D/g,'').length >= 8;
  if (!titulo || !precioRaw || !zona || !nombre || !emailOk || !phoneOk) {
    msg.className = 'msg err';
    msg.textContent = 'Completá título, precio, zona, nombre, email y teléfono válidos.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Publicando...';
  msg.className = 'msg';

  const photos = fotosTxt.split(/\n+/).map(s=>s.trim()).filter(s=>/^https?:\/\//i.test(s)).slice(0,12);
  const item = {
    id: 'u' + Date.now().toString(36),
    title: titulo,
    price: formatPrice(precioRaw),
    zona: zona,
    ambientes: ambientes,
    dormitorios: dormitorios ? (dormitorios.match(/dorm/i) ? dormitorios : dormitorios + ' dorm.') : '',
    m2: m2 ? (m2.match(/m/) ? m2 : m2 + ' m²') : '',
    banos: banos ? (banos.match(/baño/i) ? banos : banos + ' baño') : '',
    features: features ? features.split(/[,;]/).map(s=>s.trim()).filter(Boolean) : [],
    desc: desc,
    main: photos[0] || '',
    photos: photos,
    tipo: 'Alquiler',
    community: true,
    contacto_nombre: nombre,
    contacto_email: email,
    contacto_tel: telefono,
    publicado: new Date().toISOString()
  };

  try {
    const res = await fetch(DB_URL);
    const db = await res.json();
    const listings = Array.isArray(db.listings) ? db.listings : [];
    listings.unshift(item);
    await fetch(DB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listings: listings.slice(0, 500) })
    });

    // aviso admin por email (si FormSubmit está activado)
    try {
      const fd = new FormData();
      fd.append('_subject', 'ZonaProp · Nueva publicación automática');
      fd.append('_template', 'table');
      fd.append('_captcha', 'false');
      fd.append('titulo', titulo);
      fd.append('precio', item.price);
      fd.append('zona', zona);
      fd.append('ambientes', ambientes);
      fd.append('nombre', nombre);
      fd.append('email', email);
      fd.append('telefono', telefono);
      fd.append('id', item.id);
      fetch('https://formsubmit.co/ajax/' + encodeURIComponent(ADMIN_EMAIL), {
        method: 'POST', body: fd, headers: { 'Accept': 'application/json' }
      }).catch(function(){});
    } catch(e) {}

    msg.className = 'msg ok';
    msg.textContent = '¡Publicado! Ya está en el listado.';
    btn.textContent = 'Publicado';
    setTimeout(function(){ location.href = 'index.html?v=' + Date.now(); }, 900);
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'No se pudo publicar. Intentá de nuevo.';
    btn.disabled = false;
    btn.textContent = 'Publicar ahora';
  }
};
</script>
</body>
</html>
