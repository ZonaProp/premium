<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Publicar departamento · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;z-index:10}
header a{color:#fff;text-decoration:none;font-size:.95rem}
header .brand{font-weight:800}
header .brand span{color:#ff5500}
.wrap{max-width:580px;margin:0 auto;padding:1.1rem 1rem 3rem}
h1{font-size:1.4rem;margin-bottom:.3rem}
.sub{color:#666;font-size:.9rem;margin-bottom:1rem;line-height:1.45}
.card{background:#fff;border-radius:16px;padding:1.15rem;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:1rem}
.card h3{font-size:.95rem;margin-bottom:.6rem}
label{display:block;font-size:.8rem;font-weight:650;margin:.7rem 0 .28rem}
input,select,textarea{width:100%;padding:.72rem .85rem;border:1.5px solid #e3e3e3;border-radius:11px;font-size:1rem;font-family:inherit;background:#fafafa}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.upload-zone{border:2px dashed #d0d0d0;border-radius:14px;padding:1.1rem;text-align:center;background:#fafafa;cursor:pointer}
.upload-zone strong{display:block;margin:.35rem 0 .15rem}
.upload-zone span{font-size:.8rem;color:#888}
.upload-zone input{display:none}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.previews:empty{display:none}
.pv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}
.btn{width:100%;margin-top:.4rem;padding:.95rem;border:0;border-radius:12px;background:#ff5500;color:#fff;font-weight:800;font-size:1.02rem;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}
.msg{margin-top:.75rem;font-size:.9rem;display:none;line-height:1.4}
.msg.ok{color:#1b5e20;display:block;background:#e8f5e9;padding:.7rem;border-radius:10px}
.msg.err{color:#b71c1c;display:block;background:#ffebee;padding:.7rem;border-radius:10px}
.progress{height:6px;background:#eee;border-radius:99px;margin-top:.7rem;overflow:hidden;display:none}
.progress>i{display:block;height:100%;width:0;background:#ff5500;transition:width .2s}
.note{font-size:.76rem;color:#888;margin-top:.85rem;line-height:1.4}
.pick-row{display:flex;gap:.5rem;margin-top:.75rem}
.pick-row button{flex:1;border:1.5px solid #e0e0e0;background:#fff;border-radius:11px;padding:.7rem;font-size:.88rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><span>●</span> ZonaProp Premium</a>
  <a href="index.html">← Listado</a>
</header>
<div class="wrap">
  <h1>Publicar departamento</h1>
  <p class="sub">Usá el botón <b>Cámara</b> o fotos JPG de la galería. Hasta 10 fotos.</p>

  <div class="card">
    <h3>Fotos</h3>
    <div class="upload-zone" id="drop">
      <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/*" multiple/>
      <input id="filesCam" type="file" accept="image/*" capture="environment" style="display:none"/>
      <div>🖼️</div>
      <strong>Elegir de la galería</strong>
      <span>JPG / PNG · hasta 10</span>
    </div>
    <div class="pick-row">
      <button type="button" id="btnGal">📁 Galería</button>
      <button type="button" id="btnCam">📷 Cámara</button>
    </div>
    <div class="previews" id="previews"></div>
    <div class="progress" id="prog"><i id="progi"></i></div>
  </div>

  <div class="card">
    <h3>Datos del aviso</h3>
    <label>Título *</label>
    <input id="titulo" type="text" maxlength="80" placeholder="3 ambientes en Palermo"/>
    <div class="row">
      <div><label>Precio (ARS) *</label><input id="precio" type="number" inputmode="numeric" placeholder="750000"/></div>
      <div><label>Zona *</label><input id="zona" type="text" placeholder="Palermo" list="zonas"/>
        <datalist id="zonas"><option value="Recoleta"/><option value="Palermo"/><option value="Belgrano"/><option value="Caballito"/><option value="Flores"/></datalist>
      </div>
    </div>
    <div class="row">
      <div><label>Ambientes *</label>
        <select id="ambientes"><option>1 amb.</option><option selected>2 amb.</option><option>3 amb.</option><option>4 amb.</option><option>5 amb.</option></select>
      </div>
      <div><label>Dormitorios</label><input id="dormitorios" type="number" inputmode="numeric" placeholder="2"/></div>
    </div>
    <div class="row">
      <div><label>m²</label><input id="m2" type="number" inputmode="numeric" placeholder="65"/></div>
      <div><label>Baños</label><input id="banos" type="number" inputmode="numeric" placeholder="1"/></div>
    </div>
    <label>Características</label><input id="features" type="text" placeholder="Balcón, cochera..."/>
    <label>Descripción</label><textarea id="desc"></textarea>
  </div>

  <div class="card">
    <h3>Contacto</h3>
    <label>Nombre *</label><input id="nombre" type="text"/>
    <div class="row">
      <div><label>Email *</label><input id="email" type="email"/></div>
      <div><label>WhatsApp *</label><input id="telefono" type="tel"/></div>
    </div>
  </div>

  <button class="btn" type="button" id="btnPub">Enviar a revisión</button>
  <div class="msg" id="msg"></div>
  <p class="note">Si falla una foto, se salta. Preferí sacar con Cámara.</p>
</div>

<script>
const ADMIN_EMAIL = 'informezonaprop@gmail.com';
const DB_URL = 'https://jsonbin-zeta.vercel.app/api/bins/KHR_lRKYwE';
const UPLOAD_URL = 'https://zonaprop-upload-informezonaprop-3360s-projects.vercel.app/api/upload';
const MAX_PHOTOS = 10;
let selectedFiles = [];

const fileInput = document.getElementById('files');
const fileCam = document.getElementById('filesCam');
const previews = document.getElementById('previews');
const drop = document.getElementById('drop');

document.getElementById('btnGal').onclick = e => { e.stopPropagation(); fileInput.click(); };
document.getElementById('btnCam').onclick = e => { e.stopPropagation(); fileCam.click(); };
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value=''; };
fileCam.onchange = () => { addFiles(fileCam.files); fileCam.value=''; };

function addFiles(list){
  for (const f of Array.from(list||[])) {
    if (selectedFiles.length >= MAX_PHOTOS) break;
    selectedFiles.push({ file: f, preview: URL.createObjectURL(f) });
  }
  renderPreviews();
}
function renderPreviews(){
  previews.innerHTML = selectedFiles.map((item,i)=>`<div class="pv"><img src="${item.preview}" onerror="this.style.opacity=.3"><button type="button" data-i="${i}">×</button></div>`).join('');
  previews.querySelectorAll('button').forEach(b=>b.onclick=()=>{URL.revokeObjectURL(selectedFiles[+b.dataset.i].preview);selectedFiles.splice(+b.dataset.i,1);renderPreviews();});
}

function loadImage(file){
  return new Promise(async (resolve, reject) => {
    try {
      if (typeof createImageBitmap === 'function') {
        try {
          const bmp = await createImageBitmap(file);
          return resolve(bmp);
        } catch(e) {}
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('formato no soportado')); };
      img.src = url;
    } catch (e) { reject(e); }
  });
}

async function compressToJpeg(file){
  const src = await loadImage(file);
  const maxSide = 1200;
  let w = src.width, h = src.height;
  if (!w || !h) throw new Error('imagen inválida');
  if (w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
  if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }

  // bajar calidad hasta quedar bajo ~900KB en dataURL (~650KB bin)
  let q = 0.7;
  let dataUrl = '';
  for (let attempt = 0; attempt < 8; attempt++) {
    const canvas = document.createElement('canvas');
    const scale = Math.pow(0.85, attempt);
    const cw = Math.max(400, Math.round(w * scale));
    const ch = Math.max(300, Math.round(h * scale));
    canvas.width = cw; canvas.height = ch;
    canvas.getContext('2d').drawImage(src, 0, 0, cw, ch);
    q = Math.max(0.35, 0.7 - attempt * 0.05);
    dataUrl = canvas.toDataURL('image/jpeg', q);
    if (dataUrl.length < 900000) break; // ~900KB texto
  }
  if (src.close) try { src.close(); } catch(e) {}
  if (!dataUrl.startsWith('data:image/jpeg')) throw new Error('no jpeg');
  return dataUrl;
}

async function uploadPhoto(dataUrl){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 45000);
  try {
    const r = await fetch(UPLOAD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataUrl }),
      signal: ctrl.signal
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.url) throw new Error(j.error || ('HTTP '+r.status));
    return j.url;
  } finally {
    clearTimeout(t);
  }
}

function formatPrice(p){
  const n = String(p).replace(/\D/g,'');
  return n ? ('$ ' + Number(n).toLocaleString('es-AR')) : 'Consultar';
}

document.getElementById('btnPub').onclick = async function(){
  const titulo = (document.getElementById('titulo').value||'').trim();
  const precioRaw = (document.getElementById('precio').value||'').trim();
  const zona = (document.getElementById('zona').value||'').trim();
  const ambientes = document.getElementById('ambientes').value;
  const dormitorios = (document.getElementById('dormitorios').value||'').trim();
  const m2 = (document.getElementById('m2').value||'').trim();
  const banos = (document.getElementById('banos').value||'').trim();
  const features = (document.getElementById('features').value||'').trim();
  const desc = (document.getElementById('desc').value||'').trim();
  const nombre = (document.getElementById('nombre').value||'').trim();
  const email = (document.getElementById('email').value||'').trim();
  const telefono = (document.getElementById('telefono').value||'').trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnPub');
  const prog = document.getElementById('prog');
  const progi = document.getElementById('progi');

  if (!titulo || !precioRaw || !zona || !nombre || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || telefono.replace(/\D/g,'').length < 8) {
    msg.className='msg err'; msg.textContent='Completá todos los campos obligatorios.'; return;
  }
  if (!selectedFiles.length) { msg.className='msg err'; msg.textContent='Agregá al menos 1 foto.'; return; }

  btn.disabled = true;
  msg.className='msg';
  prog.style.display='block';
  progi.style.width='2%';

  const photos = [];
  let fallidas = 0;
  const files = selectedFiles.slice(0, MAX_PHOTOS);

  try {
    for (let i=0;i<files.length;i++){
      btn.textContent = 'Foto '+(i+1)+'/'+files.length+'…';
      try {
        const dataUrl = await compressToJpeg(files[i].file);
        const url = await uploadPhoto(dataUrl);
        photos.push(url);
      } catch (err) {
        console.warn(err);
        fallidas++;
      }
      progi.style.width = Math.round(((i+1)/files.length)*85)+'%';
    }

    if (!photos.length) {
      throw new Error('No se pudo subir ninguna foto. Usá el botón Cámara o una JPG de la galería.');
    }

    btn.textContent = 'Guardando…';
    progi.style.width = '92%';

    const item = {
      id: 'u'+Date.now().toString(36),
      title: titulo,
      price: formatPrice(precioRaw),
      zona, ambientes,
      dormitorios: dormitorios ? dormitorios+' dorm.' : '',
      m2: m2 ? m2+' m²' : '',
      banos: banos ? banos+(banos==='1'?' baño':' baños') : '',
      features: features ? features.split(/[,;]/).map(s=>s.trim()).filter(Boolean) : [],
      desc,
      main: photos[0],
      photos,
      tipo: 'Alquiler',
      community: true,
      contacto_nombre: nombre,
      contacto_email: email,
      contacto_tel: telefono,
      publicado: new Date().toISOString(),
      estado: 'pendiente'
    };

    const res = await fetch(DB_URL+'?t='+Date.now());
    const db = await res.json();
    const listings = Array.isArray(db.listings)?db.listings:[];
    const pending = Array.isArray(db.pending)?db.pending:[];
    pending.unshift(item);
    const put = await fetch(DB_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ listings, pending: pending.slice(0,80) }) });
    if (!put.ok) throw new Error('No se pudo guardar el aviso');

    progi.style.width='100%';
    try {
      const fd = new FormData();
      fd.append('_subject','ZonaProp · PENDIENTE DE APROBACIÓN');
      fd.append('_template','table');
      fd.append('_captcha','false');
      fd.append('panel_admin','https://zonaprop.github.io/premium/admin.html?id='+item.id);
      fd.append('titulo',titulo); fd.append('precio',item.price); fd.append('zona',zona);
      fd.append('fotos',String(photos.length)); fd.append('nombre',nombre);
      fd.append('email',email); fd.append('telefono',telefono); fd.append('id',item.id);
      fetch('https://formsubmit.co/ajax/'+encodeURIComponent(ADMIN_EMAIL),{method:'POST',body:fd,headers:{'Accept':'application/json'}}).catch(()=>{});
    } catch(e) {}

    msg.className='msg ok';
    msg.textContent = '¡Listo! Enviado a revisión con '+photos.length+' foto(s)'+(fallidas?' ('+fallidas+' fallaron)':'')+'.';
    btn.textContent = 'Enviado';
  } catch(e) {
    msg.className='msg err';
    msg.textContent = e.message || 'Error al enviar';
    btn.disabled = false;
    btn.textContent = 'Enviar a revisión';
    prog.style.display='none';
  }
};
</script>
</body>
</html>
