<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Publicar departamento · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f0f0f0;color:#222;padding:1rem}.card{background:#fff;border-radius:16px;padding:1.5rem;max-width:480px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}h1{font-size:1.3rem;margin-bottom:1rem}label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .25rem}input,textarea,select{width:100%;padding:.6rem;border:1.5px solid #ddd;border-radius:10px;font-size:1rem}button{width:100%;padding:.85rem;border:0;border-radius:12px;background:#ff5500;color:#fff;font-weight:800;font-size:1rem;margin-top:1rem;cursor:pointer}.wa{background:#25D366;margin-top:.5rem;display:block;text-align:center;padding:.85rem;border-radius:12px;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>Publicar departamento</h1>
  <p style="font-size:.9rem;color:#666;margin-bottom:1rem">Completá los datos y te contactamos por WhatsApp.</p>
  <label>Dirección / Zona</label>
  <input id="zona" placeholder="Ej: Recoleta, Palermo..."/>
  <label>Ambientes</label>
  <input id="amb" placeholder="Ej: 2 ambientes"/>
  <label>Precio</label>
  <input id="precio" placeholder="Ej: 800000"/>
  <label>Teléfono de contacto</label>
  <input id="telefono" type="tel" placeholder="11 5569-2356"/>
  <label>Comentarios</label>
  <textarea id="msg" rows="3" placeholder="Detalles adicionales"></textarea>
  <button type="button" onclick="enviar()">Enviar por WhatsApp</button>
  <a class="wa" href="https://wa.me/5491155692356?text=Hola!%20Quiero%20publicar%20un%20departamento">WhatsApp directo</a>
</div>
<script>
function enviar(){
  var z=document.getElementById('zona').value||'';
  var a=document.getElementById('amb').value||'';
  var p=document.getElementById('precio').value||'';
  var t=document.getElementById('telefono').value||'';
  var m=document.getElementById('msg').value||'';
  var text='Hola! Quiero publicar un departamento.\nZona: '+z+'\nAmbientes: '+a+'\nPrecio: '+p+'\nTel: '+t+'\n'+m;
  window.open('https://wa.me/5491155692356?text='+encodeURIComponent(text),'_blank');
}
</script>
</body>
</html>
